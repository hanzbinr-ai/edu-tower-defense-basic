<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Tower Defense</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #f0e6d0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; }
        .screen.active { display: flex; }

        /* HOME */
        #homeScreen { justify-content: center; text-align: center; background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 100%); }
        #homeScreen h1 { font-size: 48px; color: #e0b15c; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #homeScreen p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
        .home-towers { margin: 30px 0; height: 120px; position: relative; }
        .mini-tower { position: absolute; width: 40px; height: 50px; background: #2e7d32; border-radius: 8px 8px 4px 4px; border: 3px solid #a5d6a7; }
        .mini-tower:nth-child(1) { left: 30%; animation: float 3s ease-in-out infinite; }
        .mini-tower:nth-child(2) { left: 50%; animation: float 3s ease-in-out infinite 0.5s; }
        .mini-tower:nth-child(3) { left: 70%; animation: float 3s ease-in-out infinite 1s; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* BUTTONS */
        button { padding: 14px 28px; margin: 8px; background: #c83b2e; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        button:hover { background: #a83228; transform: translateY(-2px); }
        button.secondary { background: transparent; border: 2px solid #e0b15c; color: #e0b15c; }
        button.secondary:hover { background: #e0b15c; color: #1a1a2e; }

        /* GAME HUD */
        #gameScreen { padding: 10px; }
        .hud-top { width: 100%; max-width: 960px; background: #16213e; border: 2px solid #e0b15c; border-radius: 12px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .hud-stats { display: flex; gap: 25px; font-size: 16px; }
        .hud-stats span { color: #e0b15c; font-weight: bold; }
        .hud-tabs { display: flex; gap: 8px; }
        .hud-tabs button { padding: 8px 16px; font-size: 14px; margin: 0; }
        canvas { border: 3px solid #e0b15c; border-radius: 12px; background: #0f3460; }
        #buffPanel, #buildPanel { display: none; width: 100%; max-width: 960px; background: #16213e; border: 1px solid #e0b15c; border-radius: 10px; padding: 12px; margin-top: 8px; text-align: center; }
        #buffPanel.active, #buildPanel.active { display: block; }
        .buff-card { display: inline-block; background: #0f3460; border: 2px solid #4CAF50; border-radius: 8px; padding: 10px 16px; margin: 5px; }

        /* QUIZ */
        #quizScreen { justify-content: center; }
        .quiz-box { background: #16213e; border: 2px solid #e0b15c; border-radius: 16px; padding: 30px; max-width: 500px; width: 100%; text-align: center; }
        .question { font-size: 22px; margin: 20px 0 30px; line-height: 1.4; }
        .options button { display: block; width: 100%; margin: 10px 0; background: #0f3460; border: 1px solid #e0b15c; }
        .options button:hover { background: #1a4a7a; }
        #quizResult { margin-top: 15px; font-size: 18px; min-height: 28px; }
    </style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
    <h1>Edu Tower Defense</h1>
    <p>Belajar sambil bertahan</p>
    <div class="home-towers">
        <div class="mini-tower"></div>
        <div class="mini-tower"></div>
        <div class="mini-tower"></div>
    </div>
    <button onclick="startGame()">Mulai Bermain</button>
    <button class="secondary" onclick="openQuizFromHome()">Jawab Soal (Buff)</button>
    <p style="margin-top:30px; font-size:14px; opacity:0.7;">Stage 1-2: Belajar dasar &nbsp;|&nbsp; Stage 3+: Buff terbuka</p>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">
    <div class="hud-top">
        <div class="hud-stats">
            <div>Stage <span id="stage">1</span></div>
            <div>Gold <span id="gold">150</span></div>
            <div>Wave <span id="wave">1</span></div>
            <div>Lives <span id="lives">20</span></div>
        </div>
        <div class="hud-tabs">
            <button onclick="showTab('build')">Bangun</button>
            <button onclick="showTab('buff')" id="tabBuff">Buff</button>
            <button class="secondary" onclick="goHome()">Home</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="buildPanel">
        <button id="btnBuild" onclick="toggleBuild()">Bangun Tower (50 Gold)</button>
        <button id="btnStart" onclick="startWave()">Mulai Wave</button>
        <div id="message" style="margin-top:8px; color:#e0b15c;">Fase Persiapan</div>
    </div>

    <div id="buffPanel">
        <div id="buffDisplay">Belum ada buff</div>
        <button onclick="openQuiz()" id="btnQuiz" style="display:none;">Jawab Soal Baru</button>
    </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
    <div class="quiz-box">
        <h2 style="color:#e0b15c;">Soal Buff</h2>
        <div class="question" id="questionText"></div>
        <div class="options" id="options"></div>
        <div id="quizResult"></div>
        <button onclick="closeQuiz()" style="margin-top:15px;">Kembali</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let stage = 1, gold = 150, wave = 1, lives = 20;
let phase = 'prep', towers = [], monsters = [], buildMode = false;
let buffUnlocked = false, activeBuffs = [];
let currentTab = 'build';

const path = [{x:-20,y:250},{x:150,y:250},{x:150,y:120},{x:380,y:120},{x:380,y:360},{x:620,y:360},{x:620,y:180},{x:920,y:180}];
let pathSegments = [], totalPathLength = 0;
for (let i = 0; i < path.length-1; i++) {
    let len = Math.hypot(path[i+1].x-path[i].x, path[i+1].y-path[i].y);
    pathSegments.push({start:path[i], end:path[i+1], length:len});
    totalPathLength += len;
}
function getPos(p) {
    let r = p;
    for (let s of pathSegments) {
        if (r <= s.length) {
            let t = r / s.length;
            return {x: s.start.x + (s.end.x-s.start.x)*t, y: s.start.y + (s.end.y-s.start.y)*t};
        }
        r -= s.length;
    }
    return path[path.length-1];
}

const questions = [
    {q:"7 + 8 = ?", opts:["14","15","16","13"], ans:1, buff:{name:"Bonus Gold +40", type:"gold", val:40}},
    {q:"Hewan yang hidup di air?", opts:["Burung","Ikan","Kucing","Ayam"], ans:1, buff:{name:"Damage +30%", type:"damage", val:1.3}},
    {q:"Planet tempat kita tinggal?", opts:["Mars","Bumi","Venus","Jupiter"], ans:1, buff:{name:"Range +40", type:"range", val:40}},
    {q:"6 x 7 = ?", opts:["42","36","48","40"], ans:0, buff:{name:"+5 Lives", type:"life", val:5}},
    {q:"Akar berfungsi untuk?", opts:["Fotosintesis","Menyerap air","Menghasilkan buah","Bernapas"], ans:1, buff:{name:"Monster Lambat", type:"slow", val:0.65}}
];

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function startGame() { showScreen('gameScreen'); updateUI(); }
function goHome() { showScreen('homeScreen'); }

function showTab(tab) {
    currentTab = tab;
    document.getElementById('buildPanel').classList.toggle('active', tab==='build');
    document.getElementById('buffPanel').classList.toggle('active', tab==='buff');
}

function updateUI() {
    document.getElementById('stage').textContent = stage;
    document.getElementById('gold').textContent = gold;
    document.getElementById('wave').textContent = wave;
    document.getElementById('lives').textContent = lives;
    document.getElementById('btnStart').disabled = phase !== 'prep';
    document.getElementById('btnBuild').disabled = phase !== 'prep' || gold < 50;
    document.getElementById('tabBuff').style.opacity = buffUnlocked ? 1 : 0.4;
    document.getElementById('btnQuiz').style.display = buffUnlocked ? 'inline-block' : 'none';

    const bd = document.getElementById('buffDisplay');
    bd.innerHTML = activeBuffs.length 
        ? activeBuffs.map(b => `<div class="buff-card">${b.name}</div>`).join('')
        : (buffUnlocked ? 'Belum ada buff aktif' : 'Buff terbuka di Stage 3');
}

function setMessage(t) { document.getElementById('message').textContent = t; }

// QUIZ
function openQuiz() {
    if (!buffUnlocked) { alert('Buff terbuka setelah menyelesaikan Stage 3'); return; }
    loadQuestion();
    showScreen('quizScreen');
}
function openQuizFromHome() {
    if (stage < 3) { alert('Selesaikan sampai Stage 3 dulu untuk membuka Buff'); return; }
    openQuiz();
}
function closeQuiz() { showScreen(document.getElementById('gameScreen').classList.contains('active') || stage>=1 ? 'gameScreen' : 'homeScreen'); updateUI(); }

let qIndex = 0, answered = false;
function loadQuestion() {
    qIndex = Math.floor(Math.random()*questions.length);
    answered = false;
    const q = questions[qIndex];
    document.getElementById('questionText').textContent = q.q;
    const opt = document.getElementById('options');
    opt.innerHTML = '';
    q.opts.forEach((o,i) => {
        const b = document.createElement('button');
        b.textContent = o;
        b.onclick = () => selectAnswer(i);
        opt.appendChild(b);
    });
    document.getElementById('quizResult').textContent = '';
}
function selectAnswer(i) {
    if (answered) return;
    answered = true;
    const q = questions[qIndex];
    const res = document.getElementById('quizResult');
    if (i === q.ans) {
        res.innerHTML = '<span style="color:#4CAF50">Benar! Buff aktif.</span>';
        activeBuffs = [q.buff];
        if (q.buff.type==='gold') gold += q.buff.val;
        if (q.buff.type==='life') lives += q.buff.val;
    } else {
        res.innerHTML = '<span style="color:#e74c3c">Salah. Tidak dapat buff.</span>';
        activeBuffs = [];
    }
    setTimeout(() => { closeQuiz(); }, 1400);
}

// DRAW
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // path
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=50;
    ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
    path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    ctx.strokeStyle='#e0b15c'; ctx.lineWidth=34; ctx.stroke();

    // towers
    towers.forEach(t => {
        ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
        ctx.fillStyle='rgba(76,175,80,0.08)'; ctx.fill();
        ctx.fillStyle='#1b5e20'; ctx.beginPath(); ctx.arc(t.x,t.y,22,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#a5d6a7'; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle='#4CAF50'; ctx.fillRect(t.x-5,t.y-30,10,18);
    });

    // monsters
    monsters.forEach(m => {
        ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(m.x,m.y,16,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#222'; ctx.fillRect(m.x-18,m.y-28,36,5);
        ctx.fillStyle='#2ecc71'; ctx.fillRect(m.x-18,m.y-28,36*(m.hp/m.maxHp),5);
    });
}

function loop() {
    draw();
    if (phase==='wave') {
        for (let i=monsters.length-1; i>=0; i--) {
            let m = monsters[i];
            let spd = m.speed * (activeBuffs.some(b=>b.type==='slow') ? 0.65 : 1);
            m.progress += spd;
            if (m.progress >= totalPathLength) {
                lives--; monsters.splice(i,1); updateUI();
                if (lives<=0) { setMessage('Game Over'); phase='prep'; updateUI(); return; }
                continue;
            }
            let pos = getPos(m.progress); m.x=pos.x; m.y=pos.y;
            towers.forEach(t => {
                if (Math.hypot(t.x-m.x, t.y-m.y) <= t.range) {
                    let dmg = t.damage * (activeBuffs.some(b=>b.type==='damage')?1.3:1);
                    m.hp -= dmg*0.018;
                    if (m.hp<=0) { gold+=12; monsters.splice(i,1); updateUI(); }
                }
            });
        }
        if (monsters.length===0) {
            phase='resolve';
            gold += 45 + stage*8;
            wave++;
            if (wave>4) {
                stage++; wave=1;
                if (stage>=3 && !buffUnlocked) {
                    buffUnlocked=true;
                    setMessage('Stage 3! Buff System terbuka');
                    showTab('buff');
                } else setMessage('Stage naik!');
            } else setMessage('Wave selesai');
            updateUI();
            setTimeout(()=>{ phase='prep'; setMessage('Persiapan'); updateUI(); },1600);
        }
    }
    requestAnimationFrame(loop);
}

function startWave() {
    if (phase!=='prep') return;
    phase='wave'; buildMode=false; setMessage('Wave berjalan...'); updateUI();
    let n = 4 + stage*2 + wave;
    for (let i=0;i<n;i++) monsters.push({
        progress: -i*45, speed:1.3+stage*0.15,
        hp:22+stage*12, maxHp:22+stage*12, x:path[0].x, y:path[0].y
    });
}
function toggleBuild() {
    if (phase!=='prep'||gold<50) return;
    buildMode=!buildMode;
    setMessage(buildMode?'Klik peta untuk taruh tower':'Batal');
    updateUI();
}
canvas.onclick = e => {
    if (!buildMode || phase!=='prep' || gold<50) return;
    const r = canvas.getBoundingClientRect();
    let range = 115 + (activeBuffs.some(b=>b.type==='range')?40:0);
    towers.push({x:e.clientX-r.left, y:e.clientY-r.top, range, damage:9});
    gold-=50; buildMode=false; setMessage('Tower siap'); updateUI();
};

// init
showTab('build');
updateUI();
loop();
</script>
</body>
</html>
